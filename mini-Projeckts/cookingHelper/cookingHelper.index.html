<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Cooking Helper</title>
    <style>
        :root {
            --bg: #f7f5f2;
            --card: #ffffff;
            --accent: #e8743b;
            --accent-soft: #fdece3;
            --text: #2b2b2b;
            --muted: #8a8a8a;
            --border: #ece8e3;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 24px;
            letter-spacing: -0.02em;
        }

        h1 span {
            color: var(--accent);
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 28px;
            width: 100%;
            max-width: 900px;
            justify-content: center;
        }

        input[type="text"] {
            flex: 1 1 220px;
            padding: 12px 16px;
            font-size: 15px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--card);
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        button {
            padding: 12px 22px;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            background: var(--accent);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.15s, transform 0.05s;
        }

        button:hover {
            background: #d4632e;
        }

        button:active {
            transform: translateY(1px);
        }

        table {
            width: 100%;
            max-width: 900px;
            border-collapse: separate;
            border-spacing: 0;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }

        thead th {
            text-align: left;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--muted);
            padding: 16px 20px;
            background: #fbf9f7;
            border-bottom: 1px solid var(--border);
        }

        tbody td {
            padding: 16px 20px;
            font-size: 15px;
            vertical-align: top;
            border-bottom: 1px solid var(--border);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover {
            background: #fbf9f7;
        }

        .recipe-title {
            font-weight: 600;
            width: 35%;
        }

        .ingredients {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .ingredients li {
            display: flex;
            justify-content: space-between;
            gap: 16px;
        }

        .ingredients .name {
            color: var(--text);
        }

        .ingredients .amount {
            color: var(--accent);
            font-weight: 600;
            white-space: nowrap;
        }

        .empty {
            color: var(--muted);
            font-style: italic;
        }
    </style>
</head>
<body>
<h1>Cooking <span>Helper</span></h1>

<div class="controls">
    <input type="text" id="ingredients" placeholder="Ingredients you have (e.g. rice, egg)">
    <input type="text" id="quantity" placeholder="How many recipes?">
    <button onclick="inputFunc()">Find recipes</button>
</div>

<table id="ingredientsTable">
    <thead>
    <tr>
        <th>Recipe</th>
        <th>Ingredients you can use</th>
    </tr>
    </thead>
    <tbody></tbody>
</table>

<script src="cookingHelper.index.js"></script>
</body>
</html>
